<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="mane" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
  </defs>
  <!-- Background Circle with Safe Zone -->
  <rect width="512" height="512" rx="128" fill="#4ade80" />
  <circle cx="256" cy="256" r="210" fill="url(#bg)" />

  <!-- Lion Mane petals -->
  <g fill="url(#mane)">
    <circle cx="256" cy="120" r="50"/>
    <circle cx="345" cy="145" r="50"/>
    <circle cx="395" cy="225" r="50"/>
    <circle cx="380" cy="315" r="50"/>
    <circle cx="315" cy="385" r="50"/>
    <circle cx="256" cy="405" r="50"/>
    <circle cx="197" cy="385" r="50"/>
    <circle cx="132" cy="315" r="50"/>
    <circle cx="117" cy="225" r="50"/>
    <circle cx="167" cy="145" r="50"/>
  </g>

  <!-- Ears -->
  <circle cx="180" cy="170" r="34" fill="#F59E0B"/>
  <circle cx="180" cy="170" r="20" fill="#F43F5E"/>
  <circle cx="332" cy="170" r="34" fill="#F59E0B"/>
  <circle cx="332" cy="170" r="20" fill="#F43F5E"/>

  <!-- Face Head -->
  <circle cx="256" cy="265" r="120" fill="url(#face)"/>

  <!-- Cheeks -->
  <circle cx="190" cy="305" r="22" fill="#FDA4AF" opacity="0.8"/>
  <circle cx="322" cy="305" r="22" fill="#FDA4AF" opacity="0.8"/>

  <!-- Eyes -->
  <ellipse cx="215" cy="250" rx="14" ry="18" fill="#1E293B"/>
  <circle cx="210" cy="244" r="5" fill="#FFFFFF"/>
  <ellipse cx="297" cy="250" rx="14" ry="18" fill="#1E293B"/>
  <circle cx="292" cy="244" r="5" fill="#FFFFFF"/>

  <!-- Snout / Nose -->
  <ellipse cx="256" cy="285" rx="28" ry="18" fill="#FEF08A"/>
  <path d="M 244 278 Q 256 270 268 278 Q 256 295 244 278 Z" fill="#991B1B"/>
  <!-- Smile -->
  <path d="M 242 298 Q 256 312 270 298" stroke="#78350F" stroke-width="5" stroke-linecap="round" fill="none"/>
  
  <!-- Little Star in Corner -->
  <path d="M 400 80 L 408 100 L 430 100 L 412 112 L 418 132 L 400 120 L 382 132 L 388 112 L 370 100 L 392 100 Z" fill="#FBBF24"/>
</svg>
